<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Site</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/easter-egg.css">
</head>
<body>
    <div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title" hidden>
        <div class="welcome-card">
            <div class="welcome-mark" aria-hidden="true"></div>
            <h2 id="welcome-title">Welcome to<br>my homepage</h2>
            <p class="welcome-name">Ruihong Zhong</p>
            <button class="enter-button" id="enter-home" type="button" aria-label="Enter homepage" title="Enter homepage">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg>
            </button>
            <p class="welcome-hint">Enter</p>
        </div>
    </div>

    <nav class="navbar">
        <span class="nav-brand"></span>
        <ul class="nav-tabs">
            <li><button class="nav-tab active" data-page="home">Home</button></li>
            <li><button class="nav-tab" data-page="notes">Learning</button></li>
            <li><button class="nav-tab" data-page="work">Workshop</button></li>
            <li><button class="nav-tab" data-page="blog">Blog</button></li>
        </ul>
    </nav>

    <main class="pages-container">

        <!-- ====== Home ====== -->
        <section class="page active" id="page-home">
            <div class="page-inner">
                <div class="home-avatar">
                    <img id="avatar-img" alt="">
                    <div class="avatar-fallback"></div>
                </div>
                <h1 class="home-name" id="home-name"></h1>
                <p class="home-bio" id="home-bio"></p>
                <div class="research-line" id="home-research" aria-label="Research fields"></div>
                <div class="home-experience" id="home-experience"></div>
                <div class="home-links" id="home-links"></div>
            </div>
        </section>

        <!-- ====== Learning ====== -->
        <section class="page" id="page-notes">
            <div class="page-inner">
                <h2 class="page-title">Something Interesting</h2>
                <h3 class="shelf-section">Notes</h3>
                <div class="card-grid" id="notes-grid"></div>
                <h3 class="shelf-section">Tutoring</h3>
                <div class="card-grid" id="tutoring-grid"></div>
            </div>
        </section>

        <!-- ====== Workshop ====== -->
        <section class="page" id="page-work">
            <div class="page-inner">
                <h2 class="page-title">The Workshop</h2>
                <p class="page-intro">Selected projects I've built and can walk through end to end. Every number is traceable to a file or a rerun.</p>
                <div class="card-grid" id="work-grid"></div>
            </div>
        </section>

        <!-- ====== Blog ====== -->
        <section class="page" id="page-blog">
            <div class="page-inner">
                <h2 class="page-title">Blog</h2>
                <div class="blog-toolbar">
                    <label for="blog-sort">Sort by date</label>
                    <select id="blog-sort">
                        <option value="desc">Newest first</option>
                        <option value="asc">Oldest first</option>
                    </select>
                </div>
                <div class="blog-list" id="blog-list"></div>
            </div>
        </section>

    </main>

    <footer class="footer">
        <div class="container"><p></p></div>
    </footer>

    <script src="blog/posts.js"></script>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/easter-egg.js"></script>
</body>
</html>
