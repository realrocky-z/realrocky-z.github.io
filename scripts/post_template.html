<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="generator" content="scripts/build_blog.py">
<title>{{TITLE}} — {{SITE_NAME}}</title>
<meta name="description" content="{{DESC}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/post.css">
<link rel="stylesheet" href="../css/pygments.css">
<script>
window.MathJax = {
  tex: { inlineMath: [['$','$'], ['\\\\(','\\\\)']], displayMath: [['$$','$$'], ['\\\\[','\\\\]']] },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body class="post-page">
<nav class="navbar">
  <a class="nav-brand" href="../index.html">{{SITE_NAME}}</a>
  <a class="nav-back" href="../index.html#blog">← Blog</a>
</nav>
<main class="post-main">
<article class="post">
<header class="post-header">
<h1 class="post-title">{{TITLE}}</h1>
<div class="post-meta"><time datetime="{{DATE}}">{{DATE}}</time>{{TAGS}}</div>
</header>
<div class="post-content">
{{CONTENT}}
</div>
</article>
<footer class="post-footer">© {{YEAR}} {{SITE_NAME}}</footer>
</main>
</body>
</html>
